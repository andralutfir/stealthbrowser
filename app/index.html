<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stealth Browser</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%236366f1'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="__BASE__/tailwind.css">
<link rel="stylesheet" href="__BASE__/theme.css">
<script>
  // Before the first paint, or the window flashes the wrong colour on open.
  (() => {
    const pref = '__THEME__';
    const dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.classList.toggle('dark', dark);
    // Colour transitions are armed only after that first paint, so the opening
    // render is not itself animated.
    addEventListener('DOMContentLoaded', () =>
      requestAnimationFrame(() => document.documentElement.classList.add('theme-ready')));
  })();
</script>
</head>
<body class="themed h-full overflow-hidden bg-zinc-50 text-zinc-900 antialiased dark:bg-zinc-950 dark:text-zinc-100">

<div class="flex h-full flex-col">

  <!-- header -->
  <header class="themed flex shrink-0 items-center gap-4 border-b border-zinc-200 bg-white/70 px-6 py-3.5 backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/50">
    <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-indigo-500 shadow-lg shadow-indigo-500/25">
      <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3 4 6v6c0 4.5 3.2 7.9 8 9 4.8-1.1 8-4.5 8-9V6z"/><circle cx="12" cy="11" r="2.5"/>
      </svg>
    </div>
    <div class="min-w-0">
      <h1 class="text-[15px] font-semibold leading-tight tracking-tight">Stealth Browser</h1>
      <p class="truncate text-[12.5px] text-zinc-500 dark:text-zinc-400">
        A new profile and a new identity every time it opens.
      </p>
    </div>

    <div class="ml-auto flex items-center gap-2">
      <div id="theme-switch" class="themed flex overflow-hidden rounded-lg border border-zinc-300 dark:border-zinc-700">
        <button type="button" data-theme="light" title="Light" class="px-2.5 py-2 transition-colors">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
        </button>
        <button type="button" data-theme="system" title="Follow the system" class="px-2.5 py-2 transition-colors">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>
          </svg>
        </button>
        <button type="button" data-theme="dark" title="Dark" class="px-2.5 py-2 transition-colors">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>

      <div class="themed flex overflow-hidden rounded-lg border border-zinc-300 dark:border-zinc-700">
        <button id="mode-simple" type="button" class="px-4 py-2 text-[13px] font-semibold transition-colors">Simple</button>
        <button id="mode-advanced" type="button" class="px-4 py-2 text-[13px] font-semibold transition-colors">Advanced</button>
      </div>
    </div>
  </header>

  <!-- body -->
  <div class="flex min-h-0 flex-1">
    <nav id="nav" class="themed w-56 shrink-0 overflow-y-auto border-r border-zinc-200 p-3 dark:border-zinc-800"></nav>
    <main id="pages" class="min-w-0 flex-1 overflow-y-auto px-8 py-7"></main>
  </div>

  <!-- log -->
  <section id="logpane" class="themed shrink-0 overflow-hidden border-t border-zinc-200 bg-white transition-all duration-300 ease-out dark:border-zinc-800 dark:bg-zinc-900/60"
           style="max-height:0;opacity:0">
    <div id="logtabs" class="hidden flex-wrap gap-1.5 border-b border-zinc-200 px-4 py-2 dark:border-zinc-800"></div>
    <pre id="logbody" class="fade-edges h-56 overflow-auto px-4 py-3 font-mono text-[12px] leading-relaxed text-zinc-600 dark:text-zinc-300"></pre>
  </section>

  <!-- actions -->
  <footer class="themed shrink-0 border-t border-zinc-200 bg-white/70 px-4 py-3 backdrop-blur dark:border-zinc-800 dark:bg-zinc-900/50">
    <div id="actions" class="flex flex-wrap items-center gap-2">
      <button data-act="launch" class="rounded-lg bg-indigo-500 px-4 py-2 text-[13px] font-semibold text-white shadow-lg shadow-indigo-500/25 transition hover:-translate-y-px hover:bg-indigo-400 active:translate-y-0 disabled:opacity-40">Launch browser</button>
      <button data-act="stop" data-btn disabled>Stop all</button>
      <button data-act="save" data-btn>Save</button>
      <button data-act="reload" data-btn>Reload</button>
      <button data-act="check" data-btn>Check setup</button>
      <button data-act="get-browser" data-btn>Get browser</button>
      <button data-act="identity" data-btn>Preview identity</button>
      <button data-act="logs" data-btn>Logs</button>
      <button data-act="macros" data-btn>Macros</button>
      <button data-act="clear" data-btn>Clear</button>
      <button data-act="toggle-log" data-btn data-right>Show log</button>
    </div>
    <p id="status" class="mt-2 truncate text-[12px] text-zinc-500 dark:text-zinc-400">Loading&hellip;</p>
  </footer>
</div>

<!-- dialog -->
<div id="dialog" class="hidden fixed inset-0 z-50 items-center justify-center bg-zinc-900/40 p-6 backdrop-blur-sm dark:bg-black/60">
  <div id="dialog-card" class="themed w-full max-w-xl overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl dark:border-zinc-700 dark:bg-zinc-900">
    <div class="flex items-start gap-3 border-b border-zinc-200 px-5 py-4 dark:border-zinc-800">
      <span id="dialog-dot" class="mt-1.5 h-2.5 w-2.5 shrink-0 rounded-full bg-amber-400"></span>
      <h2 id="dialog-title" class="text-[15px] font-semibold">Something went wrong</h2>
    </div>
    <pre id="dialog-body" class="max-h-80 overflow-auto px-5 py-4 font-mono text-[12px] leading-relaxed whitespace-pre-wrap text-zinc-600 dark:text-zinc-300"></pre>
    <div class="flex justify-end border-t border-zinc-200 px-5 py-3 dark:border-zinc-800">
      <button id="dialog-ok" class="rounded-lg bg-indigo-500 px-4 py-2 text-[13px] font-semibold text-white transition hover:bg-indigo-400">OK</button>
    </div>
  </div>
</div>

<!--
  Classes only added at runtime, listed once so the stylesheet built by
  tools/build-css.js contains them. Without this they would be missing exactly
  when something has gone wrong and the styling matters most.
-->
<div hidden class="text-rose-500 text-emerald-500 text-amber-500 dark:text-rose-400 dark:text-emerald-400 dark:text-amber-400
                   bg-rose-400 bg-emerald-400 bg-amber-400 bg-zinc-300 dark:bg-zinc-600
                   animate-rise animate-slidein animate-pop animate-fade
                   bg-indigo-500 text-white text-indigo-600 dark:text-indigo-300 bg-indigo-500/10
                   ring-1 ring-indigo-400 border-indigo-400 opacity-0 opacity-100"></div>

<script src="__BASE__/schema.js"></script>
<script>window.BASE = '__BASE__'; window.THEME = '__THEME__';</script>
<script src="__BASE__/app.js"></script>
</body>
</html>
